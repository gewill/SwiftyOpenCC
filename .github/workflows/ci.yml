name: OpenCC Compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencc-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenCC Compatibility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify bundled resources
        run: python3 scripts/update-opencc-resources.py --check
      - name: Verify iOS resource bundle signing
        run: bash scripts/check-ios-resource-signing.sh
      - name: Check generation validation failures
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Compare against the official CLI
        run: python3 scripts/check-official-cli.py
      - name: Preserve CLI comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-cli-comparison
          path: .build/official-cli-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Resolve a Git revision dependency
        run: python3 scripts/check-revision-dependency.py
      - name: SwiftPM compatibility and lifetime tests
        run: swift test
      - name: AddressSanitizer regression
        run: swift test --sanitize=address --scratch-path .build/asan
      - name: ThreadSanitizer concurrent creation and conversion
        run: swift test --sanitize=thread --scratch-path .build/tsan --filter OpenCCTests.testConcurrentCreationAndSharedConversion
      - name: Verify tracked state
        run: git diff --exit-code
