name: OpenCC Compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencc-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenCC Compatibility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify bundled resources
        run: python3 scripts/update-opencc-resources.py --check
      - name: Resolve a Git revision dependency
        run: python3 scripts/check-revision-dependency.py
      - name: SwiftPM compatibility and lifetime tests
        run: swift test
      - name: AddressSanitizer regression
        run: swift test --sanitize=address --scratch-path .build/asan
      - name: ThreadSanitizer concurrent creation and conversion
        run: swift test --sanitize=thread --scratch-path .build/tsan --filter OpenCCTests.testConcurrentCreationAndSharedConversion
      - name: Verify tracked state
        run: git diff --exit-code
